---
- name: Deploy Cellblock Cat and Mouse
  hosts: game
  become: true
  vars:
    game_domain: cellblockcatandmouse.africandroid.world
    game_repo: https://github.com/olamidebello/cellblockcatandmouse.git
    game_ref: main
    game_port: 18842
    letsencrypt_email: '{{ lookup(''ansible.builtin.env'', ''LETSENCRYPT_EMAIL'') }}'
    enable_tls: false
    game_expected_ipv4: 154.16.170.86
  tasks:
  - name: Check settings before changing the server
    ansible.builtin.assert:
      that:
      - game_domain is match('^[a-zA-Z0-9.-]+$')
      - game_port | int > 1024
      - game_port | int < 65536
      - not (enable_tls | bool) or (letsencrypt_email | length > 3)
  - name: Check existing domain certificate
    ansible.builtin.stat:
      path: /etc/letsencrypt/live/{{ game_domain }}/fullchain.pem
    register: game_certificate
  - name: Install runtime and gateway
    ansible.builtin.apt:
      name:
      - git
      - python3
      - nginx
      - certbot
      - python3-certbot-nginx
      update_cache: true
  - name: Create service account
    ansible.builtin.user:
      name: cellblock
      system: true
      home: /var/lib/cellblock
      create_home: true
  - name: Pull application
    ansible.builtin.git:
      repo: '{{ game_repo }}'
      dest: /opt/cellblock
      version: '{{ game_ref }}'
    notify: Restart game
  - name: Install service
    ansible.builtin.copy:
      dest: /etc/systemd/system/cellblock.service
      mode: '0644'
      content: '[Unit]

        Description=Cellblock Cat and Mouse

        After=network.target

        [Service]

        User=cellblock

        WorkingDirectory=/opt/cellblock

        Environment=GAME_DB=/var/lib/cellblock/game.db

        Environment=PORT={{ game_port }}

        ExecStart=/usr/bin/python3 /opt/cellblock/server.py

        Restart=always

        RestartSec=3

        NoNewPrivileges=true

        ProtectSystem=strict

        ProtectHome=true

        ReadWritePaths=/var/lib/cellblock

        PrivateTmp=true

        [Install]

        WantedBy=multi-user.target

        '
    notify: Restart game
  - name: Start game
    ansible.builtin.systemd:
      name: cellblock
      enabled: true
      state: started
      daemon_reload: true
  - name: Remove exact game hostname from conflicting active virtual hosts
    ansible.builtin.command:
      argv:
      - python3
      - /opt/cellblock/scripts/repair-domain-routing.py
      - --domain
      - '{{ game_domain }}'
    register: routing_repair
    changed_when: (routing_repair.stdout | from_json).changed
  - name: Discover existing address-specific Nginx listener groups
    ansible.builtin.command:
      argv:
      - python3
      - /opt/cellblock/scripts/nginx-listeners.py
      - --ipv4
      - '{{ game_expected_ipv4 }}'
    register: game_listener_groups
    changed_when: false
  - name: Check certificate hostname and validity
    register: game_cert_check
    changed_when: false
    failed_when: false
    ansible.builtin.command:
      argv:
      - python3
      - /opt/cellblock/scripts/check-certificate.py
      - --domain
      - '{{ game_domain }}'
      - --certificate
      - /etc/letsencrypt/live/{{ game_domain }}/fullchain.pem
  - name: Select verified TLS state
    ansible.builtin.set_fact:
      game_tls_ready: '{{ game_cert_check.rc == 0 }}'
  - name: Create domain-specific ACME challenge directory
    ansible.builtin.file:
      path: /var/www/cellblock-acme/.well-known/acme-challenge
      state: directory
      mode: '0755'
  - name: Install domain gateway
    ansible.builtin.copy:
      dest: /etc/nginx/sites-available/cellblock
      mode: '0644'
      content: "server {\n  listen 80;\n{% for endpoint in (game_listener_groups.stdout | from_json).http_extra\
        \ %}\n  listen {{ endpoint }};\n{% endfor %}\n  server_name {{ game_domain }};\n  location ^~ /.well-known/acme-challenge/\
        \ { root /var/www/cellblock-acme; }\n{% if game_tls_ready %}\n  location / { return 301 https://$host$request_uri;\
        \ }\n{% else %}\n  location / {\n    proxy_pass http://127.0.0.1:{{ game_port }};\n    proxy_set_header\
        \ Host $host;\n    proxy_set_header X-Forwarded-Proto $scheme;\n  }\n{% endif %}\n}\n{% if game_tls_ready\
        \ %}\nserver {\n  listen 443 ssl;\n{% for endpoint in (game_listener_groups.stdout | from_json).https_extra\
        \ %}\n  listen {{ endpoint }} ssl;\n{% endfor %}\n  server_name {{ game_domain }};\n  ssl_certificate /etc/letsencrypt/live/{{\
        \ game_domain }}/fullchain.pem;\n  ssl_certificate_key /etc/letsencrypt/live/{{ game_domain }}/privkey.pem;\n\
        \  ssl_protocols TLSv1.2 TLSv1.3;\n  client_max_body_size 8k;\n  location / {\n    proxy_pass http://127.0.0.1:{{\
        \ game_port }};\n    proxy_set_header Host $host;\n    proxy_set_header X-Forwarded-Proto $scheme;\n   \
        \ proxy_set_header X-Real-IP $remote_addr;\n  }\n}\n{% endif %}\n"
      backup: true
  - name: Enable gateway
    ansible.builtin.file:
      src: /etc/nginx/sites-available/cellblock
      dest: /etc/nginx/sites-enabled/cellblock
      state: link
  - name: Validate Nginx
    ansible.builtin.command: nginx -t
    changed_when: false
  - name: Reload gateway
    ansible.builtin.systemd:
      name: nginx
      state: reloaded
      enabled: true
  - name: Apply pending application restart
    ansible.builtin.meta: flush_handlers
  - name: Verify application
    ansible.builtin.uri:
      url: http://127.0.0.1:{{ game_port }}/health
      status_code: 200
    register: game_health
    retries: 10
    delay: 2
    until: game_health.status == 200
    failed_when: game_health.status != 200 or (game_health.json.app | default('')) != 'cellblockcatandmouse'
  - name: Verify HTTP hostname routes to the game when no certificate exists
    ansible.builtin.uri:
      url: http://127.0.0.1/
      headers:
        Host: '{{ game_domain }}'
      return_content: true
      status_code: 200
    register: game_page
    failed_when: game_page.status != 200 or 'CELLBLOCK' not in game_page.content
    when: not game_tls_ready
  - name: Validate certificate email
    ansible.builtin.assert:
      that: letsencrypt_email | length > 3
    when: enable_tls | bool
  - name: Obtain domain certificate after DNS points to this server
    ansible.builtin.command:
      argv: '{{ [''certbot'',''certonly'',''--webroot'',''-w'',''/var/www/cellblock-acme'',''--cert-name'',game_domain,''-d'',game_domain,''--non-interactive'',''--agree-tos'',''--keep-until-expiring'']
        + ([''-m'',letsencrypt_email] if letsencrypt_email | length > 3 else [''--register-unsafely-without-email''])
        }}'
    when: enable_tls | bool
  - name: Verify issued certificate hostname
    ansible.builtin.command:
      argv:
      - python3
      - /opt/cellblock/scripts/check-certificate.py
      - --domain
      - '{{ game_domain }}'
      - --certificate
      - /etc/letsencrypt/live/{{ game_domain }}/fullchain.pem
    changed_when: false
    when: enable_tls | bool
  - name: Enable verified HTTPS configuration
    ansible.builtin.copy:
      dest: /etc/nginx/sites-available/cellblock
      mode: '0644'
      backup: true
      content: "server {\n  listen 80;\n{% for endpoint in (game_listener_groups.stdout | from_json).http_extra\
        \ %}\n  listen {{ endpoint }};\n{% endfor %}\n  server_name {{ game_domain }};\n  location ^~ /.well-known/acme-challenge/\
        \ { root /var/www/cellblock-acme; }\n{% if game_tls_ready %}\n  location / { return 301 https://$host$request_uri;\
        \ }\n{% else %}\n  location / {\n    proxy_pass http://127.0.0.1:{{ game_port }};\n    proxy_set_header\
        \ Host $host;\n    proxy_set_header X-Forwarded-Proto $scheme;\n  }\n{% endif %}\n}\n{% if game_tls_ready\
        \ %}\nserver {\n  listen 443 ssl;\n{% for endpoint in (game_listener_groups.stdout | from_json).https_extra\
        \ %}\n  listen {{ endpoint }} ssl;\n{% endfor %}\n  server_name {{ game_domain }};\n  ssl_certificate /etc/letsencrypt/live/{{\
        \ game_domain }}/fullchain.pem;\n  ssl_certificate_key /etc/letsencrypt/live/{{ game_domain }}/privkey.pem;\n\
        \  ssl_protocols TLSv1.2 TLSv1.3;\n  client_max_body_size 8k;\n  location / {\n    proxy_pass http://127.0.0.1:{{\
        \ game_port }};\n    proxy_set_header Host $host;\n    proxy_set_header X-Forwarded-Proto $scheme;\n   \
        \ proxy_set_header X-Real-IP $remote_addr;\n  }\n}\n{% endif %}\n"
    vars:
      game_tls_ready: true
    when: enable_tls | bool
  - name: Validate final TLS listener configuration
    ansible.builtin.command: nginx -t
    changed_when: false
  - name: Reload verified TLS listeners
    ansible.builtin.systemd:
      name: nginx
      state: reloaded
  - name: Verify local HTTPS identity with real SNI and certificate validation
    ansible.builtin.command:
      argv:
      - python3
      - /opt/cellblock/scripts/verify-domain.py
      - --domain
      - '{{ game_domain }}'
      - --address
      - 127.0.0.1
      - --address
      - '{{ game_expected_ipv4 }}'
    changed_when: false
    when: enable_tls | bool
  - name: Install automatic certificate renewal reload hook
    ansible.builtin.copy:
      dest: /etc/letsencrypt/renewal-hooks/deploy/cellblock-nginx
      mode: '0755'
      content: '#!/bin/sh

        nginx -t && systemctl reload nginx

        '
    when: enable_tls | bool
  - name: Enable automatic certificate renewal
    ansible.builtin.systemd:
      name: certbot.timer
      enabled: true
      state: started
    when: enable_tls | bool
  - name: Verify public HTTPS backend identity
    ansible.builtin.command:
      argv:
      - python3
      - /opt/cellblock/scripts/verify-domain.py
      - --domain
      - '{{ game_domain }}'
    changed_when: false
    when: enable_tls | bool
  - name: Verify public HTTPS serves the game
    ansible.builtin.uri:
      url: https://{{ game_domain }}/
      return_content: true
      status_code: 200
    register: game_public_page
    failed_when: game_public_page.status != 200 or 'CELLBLOCK' not in game_public_page.content
    when: enable_tls | bool
  - name: Report deployment target
    ansible.builtin.debug:
      msg: 'Game service running on 127.0.0.1:{{ game_port }}. Domain: {{ game_domain }}. DNS must point to this
        server.'
  handlers:
  - name: Restart game
    ansible.builtin.systemd:
      name: cellblock
      state: restarted
      daemon_reload: true
